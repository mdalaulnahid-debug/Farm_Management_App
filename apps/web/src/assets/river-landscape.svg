<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMax slice">
  <!-- Barishal at dawn: river with a nouka and ducks, paddy, a band of mustard flowers. Transparent sky so the page colour shows through.
       Motion lives here so the artwork can be reused as a plain <img>; it is switched off for reduced motion. -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .ripples { animation: drift 9s ease-in-out infinite alternate; }
      .ripples.slow { animation-duration: 13s; animation-direction: alternate-reverse; }
      .boat { animation: sway 14s ease-in-out infinite alternate; }
      .duck { animation: bob 2.8s ease-in-out infinite alternate; }
      .duck.d2 { animation-delay: -.9s; } .duck.d3 { animation-delay: -1.6s; } .duck.d4 { animation-delay: -2.2s; }
      .ducks { animation: paddle 22s ease-in-out infinite alternate; }
      .sun-glow { animation: glow 6s ease-in-out infinite alternate; transform-origin: 905px 150px; }
    }
    @keyframes drift { to { transform: translateX(-26px); } }
    @keyframes sway { from { transform: translateX(-10px); } to { transform: translateX(14px); } }
    @keyframes bob { to { transform: translateY(-2.5px); } }
    @keyframes paddle { to { transform: translateX(34px); } }
    @keyframes glow { from { opacity: .14; transform: scale(.96); } to { opacity: .26; transform: scale(1.04); } }
  </style>
  <defs>
    <pattern id="paddy" width="14" height="22" patternUnits="userSpaceOnUse">
      <path d="M3 22 L5 6 M9 22 L8 4 M12 22 L13 9" stroke="#2f6b3c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </pattern>
    <pattern id="paddy2" width="10" height="14" patternUnits="userSpaceOnUse">
      <path d="M2 14 L3 4 M6 14 L6 2 M9 14 L9 6" stroke="#4d8a45" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    </pattern>
    <pattern id="mustard" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.8" fill="#e8b21f"/><circle cx="9" cy="9" r="1.5" fill="#f2c94c"/>
    </pattern>
    <g id="duck"><ellipse cx="0" cy="0" rx="17" ry="8" fill="#fbfbf6"/><circle cx="14" cy="-9" r="6" fill="#fbfbf6"/><path d="M19 -9 l8 2 l-8 2 z" fill="#e3a81b"/><path d="M-17 -2 l-7 -5 l3 7 z" fill="#fbfbf6"/></g>
  </defs>
  <circle class="sun-glow" cx="905" cy="150" r="86" fill="#f1c24a" opacity=".18"/>
  <circle cx="905" cy="150" r="58" fill="#f1c24a"/>
  <path d="M0 238 C80 210 140 222 210 205 C260 194 300 214 360 200 C430 184 470 208 540 196 C620 182 660 205 740 192 C820 178 870 200 950 190 C1030 180 1100 198 1200 186 L1200 262 L0 262 Z" fill="#2c5a44"/>
  <path d="M0 250 C60 236 90 214 120 218 C150 222 160 200 190 204 C230 210 240 190 270 196 C300 202 320 230 360 232 L360 262 L0 262 Z" fill="#1f4a37"/>
  <path d="M760 240 C800 222 820 200 850 206 C880 212 890 190 925 198 C955 205 975 228 1010 226 C1060 222 1100 236 1200 230 L1200 262 L760 262 Z" fill="#1f4a37"/>
  <g fill="#173a2b">
    <path d="M150 232 l4 -48 l4 48 z"/><path d="M146 196 c-14 -6 -22 2 -30 -4 c10 -4 20 -6 34 0 z M162 196 c14 -6 22 2 30 -4 c-10 -4 -20 -6 -34 0 z M154 186 c-6 -12 0 -20 -4 -28 c6 8 8 18 4 28 z"/>
    <path d="M1060 236 l4 -56 l4 56 z"/><path d="M1056 190 c-16 -6 -24 2 -33 -4 c11 -4 22 -6 37 0 z M1072 190 c16 -6 24 2 33 -4 c-11 -4 -22 -6 -37 0 z M1064 180 c-6 -13 0 -22 -4 -30 c6 8 8 20 4 30 z"/>
  </g>
  <path d="M0 262 L1200 262 L1200 340 C1050 352 900 330 760 344 C600 360 430 334 280 348 C170 358 80 346 0 352 Z" fill="#a9c2c0"/>
  <g class="ripples" stroke="#e9f1ef" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M90 290 h70 M240 305 h46 M420 284 h90 M610 300 h54 M780 288 h80 M980 306 h60 M1100 286 h50"/>
  </g>
  <g class="ripples slow" stroke="#e9f1ef" stroke-width="2" stroke-linecap="round" opacity=".5">
    <path d="M150 322 h40 M520 318 h70 M860 326 h44 M1040 320 h52"/>
  </g>
  <g class="boat">
    <path d="M610 286 C640 300 720 300 752 286 C738 298 726 304 680 304 C636 304 624 298 610 286 Z" fill="#3a2a1c"/>
    <path d="M650 287 C664 270 700 268 716 286 Z" fill="#6b4a2c"/>
    <path d="M688 286 L688 244" stroke="#3a2a1c" stroke-width="2.4"/>
  </g>
  <g class="ducks">
    <g transform="translate(300 300)"><g class="duck"><use href="#duck"/></g></g>
    <g transform="translate(345 312) scale(.85)"><g class="duck d2"><use href="#duck"/></g></g>
    <g transform="translate(262 316) scale(.8)"><g class="duck d3"><use href="#duck"/></g></g>
    <g transform="translate(392 298) scale(.7)"><g class="duck d4"><use href="#duck"/></g></g>
  </g>
  <path d="M0 352 C80 346 170 358 280 348 C430 334 600 360 760 344 C900 330 1050 352 1200 340 L1200 410 L0 410 Z" fill="#6f9e4f"/>
  <rect x="0" y="352" width="1200" height="58" fill="url(#paddy2)" opacity=".7"/>
  <path d="M0 400 C200 390 380 412 600 398 C820 384 1000 404 1200 394 L1200 455 L0 455 Z" fill="#d9b23a"/>
  <rect x="0" y="398" width="1200" height="57" fill="url(#mustard)"/>
  <path d="M0 446 C240 436 420 458 640 444 C860 430 1020 452 1200 442 L1200 520 L0 520 Z" fill="#3f7a43"/>
  <rect x="0" y="446" width="1200" height="74" fill="url(#paddy)"/>
</svg>
